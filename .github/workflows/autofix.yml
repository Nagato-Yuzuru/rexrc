# Runs the prek hooks; autofix.ci (a GitHub App) pushes any fixes back to the
# branch. The App finds the workflow by the name "autofix.ci".
name: autofix.ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zsh for the zsh -n hook; readline headers for mise's Lua 5.1 build (make linux).
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh libreadline-dev

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7 # must match the mise that wrote mise.lock

      # Fixers exit non-zero when they change files; this step only produces the diff.
      - name: Apply fixers
        run: prek run --all-files || true

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4

      # On the fixed tree, only checks without a fix can still fail.
      - name: Verify remaining checks
        run: prek run --all-files
