name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci # mise.ci.toml: uv, which local machines provide themselves

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zsh for the zsh -n hook; readline headers for mise's Lua 5.1 build (make linux).
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh libreadline-dev

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.7 # must match the mise that wrote mise.lock

      - name: Unit tests
        run: mise run test
